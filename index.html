<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Task Dashboard</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard-layout">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="brand">
                <i class="fa-solid fa-graduation-cap"></i>
                <h2>TaskSpace</h2>
            </div>

            <nav class="nav-menu">
                <p class="menu-label">Menu</p>
                <ul>
                    <li class="active" data-filter="All">
                        <a href="#"><i class="fa-solid fa-list-check"></i> All Tasks</a>
                    </li>
                    <li data-filter="Pending">
                        <a href="#"><i class="fa-solid fa-clock"></i> Pending</a>
                    </li>
                    <li data-filter="Completed">
                        <a href="#"><i class="fa-solid fa-circle-check"></i> Completed</a>
                    </li>
                </ul>
            </nav>

            <!-- Stats Overview Card -->
            <div class="sidebar-stats">
                <p class="menu-label">Overview</p>
                <div class="stat-card">
                    <span class="stat-title">Pending</span>
                    <span class="stat-value" id="stat-pending">0</span>
                </div>
                <div class="stat-card">
                    <span class="stat-title">Completed</span>
                    <span class="stat-value" id="stat-completed">0</span>
                </div>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <!-- Top Header & Search -->
            <header class="top-header">
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="search-input" placeholder="Search tasks by title...">
                </div>
            </header>

            <!-- Task Form Card -->
            <section class="card form-card">
                <h2 id="form-title">Create New Task</h2>
                <form id="task-form">
                    <input type="hidden" id="task-id">
                    
                    <div class="form-group">
                        <label for="task-title">Task Title *</label>
                        <input type="text" id="task-title" placeholder="e.g., Submit Database Assignment" required>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="task-priority">Priority</label>
                            <select id="task-priority">
                                <option value="Low">Low Priority</option>
                                <option value="Medium" selected>Medium Priority</option>
                                <option value="High">High Priority</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="task-due-date">Due Date *</label>
                            <input type="date" id="task-due-date" required>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="submit" id="submit-btn" class="btn btn-primary">
                            <i class="fa-solid fa-plus"></i> Add Task
                        </button>
                        <button type="button" id="cancel-btn" class="btn btn-secondary" style="display: none;">Cancel</button>
                    </div>
                </form>
            </section>

            <!-- Tasks List Container -->
            <section class="task-list-section">
                <div class="section-header">
                    <h2 id="view-title">All Tasks</h2>
                </div>

                <ul id="task-list" class="task-list"></ul>
                
                <div id="empty-state" class="empty-state" style="display: none;">
                    <i class="fa-solid fa-folder-open empty-icon"></i>
                    <p>No tasks found in this view.</p>
                </div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
    <!-- Replace your chat-widget div with this -->
<div class="chat-widget">
    <button id="chat-toggle-btn" class="chat-toggle-btn" onclick="toggleChat()" aria-label="Toggle Chat">
        <i class="fa-solid fa-comments"></i>
    </button>

    <div id="chat-window" class="chat-window hidden">
        <div class="chat-header">
            <div class="chat-bot-info">
                <i class="fa-solid fa-robot"></i>
                <div>
                    <h3>TaskSpace Assistant</h3>
                    <span class="status-online"><i class="fa-solid fa-circle" style="font-size: 8px;"></i> Online</span>
                </div>
            </div>
            <button id="chat-close-btn" class="chat-close-btn" onclick="closeChat()"><i class="fa-solid fa-xmark"></i></button>
        </div>

        <div id="chat-messages" class="chat-messages">
            <div class="message bot-message">
                Hello! I am your TaskSpace Assistant. How can I help you today?
                <div class="suggestion-chips">
                    <button class="chip" onclick="handleChipClick('What are my pending tasks?')">Pending tasks?</button>
                    <button class="chip" onclick="handleChipClick('How do I add a task?')">How to add task?</button>
                    <button class="chip" onclick="handleChipClick('Show productivity tips')">Study tips</button>
                </div>
            </div>
        </div>

        <div class="chat-input-area">
            <input type="text" id="chat-input" placeholder="Ask a question..." onkeypress="handleChatKeyPress(event)">
            <button id="chat-send-btn" class="chat-send-btn" onclick="sendChatMessage()">
                <i class="fa-solid fa-paper-plane"></i>
            </button>
        </div>
    </div>
</div>
</body>
</html>
