apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider

data:
  provider.yml: |
    apiVersion: 1

    providers:
      - name: Campus Monitoring
        orgId: 1
        folder: Campus
        type: file
        disableDeletion: true
        editable: true

        options:
          path: /var/lib/grafana/dashboards