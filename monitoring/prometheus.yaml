apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config

data:
  prometheus.yml: |
    global:
      scrape_interval: 5s

    scrape_configs:

      # ==========================================
      # 1. SMART CAMPUS APPLICATION
      # ==========================================
      - job_name: "campus-app"

        metrics_path: /metrics

        static_configs:
          - targets:
              - campus-service:80


      # ==========================================
      # 2. KUBE STATE METRICS
      # ==========================================
      - job_name: "kube-state-metrics"

        static_configs:
          - targets:
              - kube-state-metrics.kube-system.svc.cluster.local:8080


---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus

spec:
  replicas: 1

  selector:
    matchLabels:
      app: prometheus

  template:
    metadata:
      labels:
        app: prometheus

    spec:
      containers:

        - name: prometheus

          image: prom/prometheus:v2.53.0

          args:
            - "--config.file=/etc/prometheus/prometheus.yml"

          ports:
            - containerPort: 9090

          volumeMounts:
            - name: config
              mountPath: /etc/prometheus

      volumes:
        - name: config

          configMap:
            name: prometheus-config


---
apiVersion: v1
kind: Service
metadata:
  name: prometheus

spec:
  selector:
    app: prometheus

  ports:
    - port: 9090
      targetPort: 9090

  type: NodePort