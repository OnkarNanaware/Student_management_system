name: Smart Campus CI/CD


on:

  push:

    branches:
      - main

  pull_request:

    branches:
      - main


jobs:


  test:

    name: Test Application

    runs-on: ubuntu-latest

    steps:


      - name: Checkout

        uses: actions/checkout@v4


      - name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.11"


      - name: Install dependencies

        run: |

          python -m pip install --upgrade pip

          pip install -r requirements.txt


      - name: Run tests

        run: |

          pytest -v


  docker-build:

    name: Build Docker Image

    needs: test

    runs-on: ubuntu-latest

    steps:


      - name: Checkout

        uses: actions/checkout@v4


      - name: Build Docker image

        run: |

          docker build -t campus-app:${{ github.sha }} .


      - name: Verify image

        run: |

          docker images
